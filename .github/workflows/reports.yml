name: Generate Reports
on:
  workflow_run:
    workflows: ["Build And Test Units Data"]
    types: [completed]  

jobs:  
  report:
    permissions:
      pull-requests: write
    runs-on: ubuntu-latest
    if: github.event.workflow_run.conclusion == 'success'
    steps:
      - name: checkout
        uses: actions/checkout@v5.0.0
        with:
          ref: "badges"
      - name: Retrieve data
        uses: actions/download-artifact@v4
        with:
          run-id: ${{ github.event.workflow_run.id }}
          merge-multiple: true
          pattern: "badges_${{ github.event.workflow_run.id }}_unit_conversions"
          path: change
      - name: Generate Report on current
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const newExpected = fs.readFileSync('change/unit-conversions-expected.txt', 'utf8');
            const newActual = fs.readFileSync('change/unit-conversions-actual.txt', 'utf8');

            const currentExpected = fs.readFileSync('badges/unit-conversions-expected.txt', 'utf8');
            const currentActual = fs.readFileSync('badges/unit-conversions-actual.txt', 'utf8');

            github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body: `### Unit Conversions

              ${newActual} out of ${newExpected} unit conversions were tested in this change.

              ${currentActual} out of ${currentExpected} unit conversions were previously tested.
              `
            })
          