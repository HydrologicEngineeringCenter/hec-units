name: Generate Reports
on:
  workflow_run:
    workflows: ["Build And Test Units Data"]
    types: [completed]  

jobs:  
  report:
    permissions:
      pull-requests: write
    runs-on: ubuntu-latest
    if: github.event.workflow_run.conclusion == 'success'
    steps:
      - name: checkout
        uses: actions/checkout@v5.0.0
      - name: Retrieve data
        uses: actions/download-artifact@v4
        with:
          run-id: ${{ github.event.workflow_run.id }}
          merge-multiple: true
          pattern: "**/.txt"

      - name: Get Baseline Values
        run: |
          git fetch origin badges
          git origin/badges -- badges/unit-conversions-*.txt
      - name: Generate Report on current
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const newExpected = fs.readFileSync('badges/unit-conversions-expected.txt', 'utf8');
            const newActual = fs.readFileSync('badges/unit-conversions-actual.txt', 'utf8');

            github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body: `### Unit Conversions\n\n${newActual} out of ${newExpected} unit conversions were tested.`
            })
          